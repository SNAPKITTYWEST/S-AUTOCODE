<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a" stroke="#5e6ad2" stroke-width="3"/>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#5e6ad2" stroke-width="2" opacity="0.3"/>
  
  <!-- Symbol ⦹ (Circled Bullet Operator) -->
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="90" fill="#5e6ad2" text-anchor="middle" font-weight="bold">⦹</text>
  
  <!-- Glow Effect -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#5e6ad2;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5e6ad2;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="70" fill="url(#glow)"/>
  
  <!-- Rotating Orbit Lines -->
  <g opacity="0.5">
    <ellipse cx="100" cy="100" rx="60" ry="30" fill="none" stroke="#5e6ad2" stroke-width="1" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="100" rx="60" ry="30" fill="none" stroke="#5e6ad2" stroke-width="1" transform="rotate(-30 100 100)"/>
  </g>
  
  <!-- Small Dots (Agents) -->
  <circle cx="100" cy="40" r="4" fill="#34c759"/>
  <circle cx="160" cy="100" r="4" fill="#f5a623"/>
  <circle cx="100" cy="160" r="4" fill="#4a90e2"/>
  <circle cx="40" cy="100" r="4" fill="#bd10e0"/>
</svg>

