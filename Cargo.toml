[workspace]
members = [
    "src/compiler",
    "src/emulator",
    "src/optimizer",
    "src/visualization",
    "src/wasm",
]
resolver = "2"

[workspace.dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
petgraph = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
getrandom = { version = "0.2", features = ["js"] }
