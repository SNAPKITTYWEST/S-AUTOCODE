[package]
name = "autocode-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = "1.0"
js-sys = "0.3"
getrandom = { workspace = true }
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Window",
    "Node",
    "Text",
    "KeyboardEvent",
    "EventTarget",
] }
autocode-compiler = { path = "../compiler" }
autocode-emulator = { path = "../emulator" }

[profile.release]
opt-level = "s"
lto = true
