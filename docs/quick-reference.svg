<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="1000" fill="#0a0a0a"/>
  
  <!-- Header -->
  <rect width="800" height="80" fill="#1c1c1c"/>
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="32" fill="#e8e8e8" font-weight="600">S-AUTOCODE Quick Reference</text>
  
  <!-- Section 1: CODEX Commands -->
  <g transform="translate(40, 120)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#5e6ad2" font-weight="600">🤖 CODEX Agent Commands</text>
    
    <rect x="0" y="15" width="720" height="180" fill="#141414" stroke="#5e6ad2" stroke-width="1" rx="8"/>
    
    <text x="20" y="45" font-family="monospace" font-size="14" fill="#34c759" font-weight="500">open editor fibonacci.py and write fibonacci code</text>
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">→ Opens Monaco editor and types code with animation</text>
    
    <text x="20" y="95" font-family="monospace" font-size="14" fill="#34c759" font-weight="500">run git status</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">→ Executes bash command and shows output</text>
    
    <text x="20" y="145" font-family="monospace" font-size="14" fill="#34c759" font-weight="500">search for 'fireworks' in all files</text>
    <text x="20" y="165" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">→ Searches codebase and shows matches</text>
  </g>
  
  <!-- Section 2: Terminal Commands -->
  <g transform="translate(40, 340)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#f5a623" font-weight="600">⚡ Terminal Commands</text>
    
    <rect x="0" y="15" width="720" height="180" fill="#141414" stroke="#f5a623" stroke-width="1" rx="8"/>
    
    <text x="20" y="45" font-family="monospace" font-size="14" fill="#4a90e2" font-weight="500">factorial 5</text>
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">→ Computes 5! = 120</text>
    
    <text x="20" y="95" font-family="monospace" font-size="14" fill="#4a90e2" font-weight="500">sum 10 20 30</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">→ Computes 10+20+30 = 60</text>
    
    <text x="20" y="145" font-family="monospace" font-size="14" fill="#4a90e2" font-weight="500">chain</text>
    <text x="20" y="165" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">→ Shows WORM blockchain</text>
  </g>
  
  <!-- Section 3: Keyboard Shortcuts -->
  <g transform="translate(40, 560)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#bd10e0" font-weight="600">⌨️ Keyboard Shortcuts</text>
    
    <rect x="0" y="15" width="720" height="150" fill="#141414" stroke="#bd10e0" stroke-width="1" rx="8"/>
    
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="80" height="28" fill="#242424" stroke="#5e6ad2" stroke-width="1" rx="4"/>
      <text x="40" y="19" font-family="monospace" font-size="12" fill="#e8e8e8" text-anchor="middle">Ctrl+K</text>
      <text x="100" y="19" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0">Command palette</text>
    </g>
    
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="80" height="28" fill="#242424" stroke="#5e6ad2" stroke-width="1" rx="4"/>
      <text x="40" y="19" font-family="monospace" font-size="12" fill="#e8e8e8" text-anchor="middle">Ctrl+S</text>
      <text x="100" y="19" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0">Save file</text>
    </g>
    
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="80" height="28" fill="#242424" stroke="#5e6ad2" stroke-width="1" rx="4"/>
      <text x="40" y="19" font-family="monospace" font-size="12" fill="#e8e8e8" text-anchor="middle">Ctrl+F</text>
      <text x="100" y="19" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0">Find in editor</text>
    </g>
  </g>
  
  <!-- Section 4: 5 Agents -->
  <g transform="translate(40, 750)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#34c759" font-weight="600">👥 5 Specialized Agents</text>
    
    <rect x="0" y="15" width="720" height="200" fill="#141414" stroke="#34c759" stroke-width="1" rx="8"/>
    
    <!-- FORGE -->
    <circle cx="30" cy="45" r="6" fill="#5e6ad2"/>
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="14" fill="#e8e8e8" font-weight="600">FORGE</text>
    <text x="130" y="50" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">Compiler • HIGH trust</text>
    
    <!-- SENTINEL -->
    <circle cx="30" cy="75" r="6" fill="#34c759"/>
    <text x="50" y="80" font-family="Arial, sans-serif" font-size="14" fill="#e8e8e8" font-weight="600">SENTINEL</text>
    <text x="130" y="80" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">Security • HIGH trust</text>
    
    <!-- ORACLE -->
    <circle cx="30" cy="105" r="6" fill="#f5a623"/>
    <text x="50" y="110" font-family="Arial, sans-serif" font-size="14" fill="#e8e8e8" font-weight="600">ORACLE</text>
    <text x="130" y="110" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">Analyzer • MEDIUM trust</text>
    
    <!-- CODEX -->
    <circle cx="30" cy="135" r="6" fill="#4a90e2"/>
    <text x="50" y="140" font-family="Arial, sans-serif" font-size="14" fill="#e8e8e8" font-weight="600">CODEX</text>
    <text x="130" y="140" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">AI Coder • HIGH trust • Fireworks AI</text>
    
    <!-- VAULT -->
    <circle cx="30" cy="165" r="6" fill="#bd10e0"/>
    <text x="50" y="170" font-family="Arial, sans-serif" font-size="14" fill="#e8e8e8" font-weight="600">VAULT</text>
    <text x="130" y="170" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0">Storage • HIGH trust</text>
  </g>
  
  <!-- Footer -->
  <g transform="translate(40, 970)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#6b6b6b">🚀 Live Demo: snapkittywest.github.io/S-AUTOCODE</text>
  </g>
</svg>

